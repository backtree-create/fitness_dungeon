<script type="module">
"use strict";
/* =========================================================
   リアル体つくりダンジョン v4 — レトロ3D（DOOM系）
   Three.js の実3D坑道 × ドット絵スプライトの敵
   動的ライティング：ランタン・たいまつ・フォグ
   ========================================================= */
const $=s=>document.querySelector(s);
let THREE=null;
try{
  THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
}catch(e){
  document.querySelector('#ovl').innerHTML=
    '<div class="panel"><h2>読み込みエラー</h2><p class="sub">3Dエンジンの読み込みに失敗しました。通信環境を確認して再読み込みしてください。</p></div>';
  throw e;
}

/* ---------------- Audio ---------------- */
let AC=null;
function ac(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();}if(AC.state==='suspended')AC.resume();return AC;}
function tone(f,dur,type='square',vol=.15,slide=0,when=0){
  const a=ac(),t=a.currentTime+when,o=a.createOscillator(),gn=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);
  gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(gn).connect(a.destination);o.start(t);o.stop(t+dur+.02);
}
function noise(dur,vol=.3,when=0){
  const a=ac(),t=a.currentTime+when,n=a.sampleRate*dur|0;
  const b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource();s.buffer=b;
  const gn=a.createGain();gn.gain.setValueAtTime(vol,t);
  s.connect(gn).connect(a.destination);s.start(t);
}
const SFX={
  step(){tone(440,.05,'square',.07)},
  hit(){noise(.12,.3);tone(200,.12,'sawtooth',.15,-80)},
  smash(){noise(.4,.5);tone(90,.4,'sawtooth',.2,-40)},
  jump(){tone(300,.16,'square',.1,260)},
  dodge(){tone(700,.1,'square',.12);tone(1050,.14,'square',.1,0,.08)},
  hurt(){tone(150,.35,'sawtooth',.2,-70);noise(.2,.25)},
  warn(){tone(980,.09,'square',.14);tone(980,.09,'square',.14,0,.14)},
  slash(){noise(.08,.25);tone(520,.1,'sawtooth',.12,300)},
  swing(){noise(.07,.15);tone(340,.1,'sine',.08,180)},
  down(){[392,330,262,196].forEach((f,i)=>tone(f,.25,'square',.13,0,i*.14))},
  chest(){[523,659,784,1046,1318].forEach((f,i)=>tone(f,.3,'square',.12,0,i*.12))},
  go(){tone(880,.2,'sine',.15)},
  count(){tone(440,.15,'sine',.14)},
  kill(){tone(260,.3,'square',.15,-160);noise(.25,.3)},
};

/* ---------------- コース定義 ---------------- */
const GOAL=58;
function makeCourse(){
  return [
    {pos:13, kind:'rock', hp:5, hpMax:5, limit:13, timer:13, done:false,
      label:'落石が来る前に<b>スクワット</b>で岩を砕け！'},
    {pos:25, kind:'battle', name:'ドクロコウモリ', hp:4, hpMax:4, done:false,
      atkMin:3.2, atkMax:4.6, tele:1.7, state:'idle', st:2.2, flinch:0, deadT:0},
    {pos:38, kind:'gap', width:1.7, window:3.0, timer:3.0, armed:false, done:false},
    {pos:51, kind:'battle', name:'ガイコツ番人', hp:7, hpMax:7, done:false, boss:true,
      atkMin:2.6, atkMax:3.9, tele:1.45, state:'idle', st:2.0, flinch:0, deadT:0},
    {pos:GOAL, kind:'goal', done:false},
  ];
}

/* ---------------- ゲーム状態 ---------------- */
const S={
  mode:null, scene:'menu',
  t:0, dist:0, v:0,
  hearts:3, score:0, streak:0, lastStepT:-9,
  reps:{step:0,squat:0,jump:0}, dodges:0, maxStreak:0,
  course:[], enc:null,
  char:{hop:0,attack:0,vault:0,walkPh:0},
  shake:0, redFlash:0, popups:[], slash:null,
  countdown:0,
};
let lastT=performance.now();
let lastJumpAny=-9;

/* ---------------- 姿勢検出 ---------------- */
const POSE={
  landmarker:null, video:$('#cam'), running:false,
  sm:{}, base:null,
  calib:{on:false, frames:[], need:70},
  squatDown:false, jumpUp:false, lastJumpT:0,
  kneeUp:{L:false,R:false}, lastStepT:0,
  visible:false, liveDepth:0, liveRise:0,
};
const LMK={LS:11,RS:12,LH:23,RH:24,LK:25,RK:26,LA:27,RA:28};
const NEED=[LMK.LS,LMK.RS,LMK.LH,LMK.RH,LMK.LK,LMK.RK,LMK.LA,LMK.RA];
const camCv=$('#camCv'),cg=camCv.getContext('2d');
function fitCam(){
  const d=Math.min(devicePixelRatio||1,2);
  const r=$('#camPane').getBoundingClientRect();
  camCv.width=r.width*d;camCv.height=r.height*d;cg.setTransform(d,0,0,d,0,0);
}
async function initPose(){
  const stat=$('#camStatus');
  stat.textContent='AIモデルを読み込み中…（初回は少し時間がかかります）';
  const url='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const vision=await import(url);
  const files=await vision.FilesetResolver.forVisionTasks(url+'/wasm');
  const opts=d=>({baseOptions:{
      modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
      delegate:d},runningMode:'VIDEO',numPoses:1});
  try{POSE.landmarker=await vision.PoseLandmarker.createFromOptions(files,opts('GPU'));}
  catch(e){POSE.landmarker=await vision.PoseLandmarker.createFromOptions(files,opts('CPU'));}
  stat.textContent='カメラを起動中…';
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
  POSE.video.srcObject=stream;
  await new Promise(r=>POSE.video.onloadedmetadata=r);
  await POSE.video.play();
  POSE.running=true;
  stat.textContent='全身（頭〜足首）が映るように下がろう';
  poseLoop();
}
let lastVideoT=-1;
function poseLoop(){
  if(!POSE.running)return;
  requestAnimationFrame(poseLoop);
  const v=POSE.video;
  if(v.currentTime===lastVideoT)return;
  lastVideoT=v.currentTime;
  let res;
  try{res=POSE.landmarker.detectForVideo(v,performance.now());}catch(e){return;}
  const lm=res.landmarks&&res.landmarks[0];
  drawCamSkeleton(lm);
  if(!lm){POSE.visible=false;POSE.liveDepth*=0.9;POSE.liveRise*=0.9;return;}
  let vis=true;
  for(const i of NEED){if(!lm[i]||(lm[i].visibility!=null&&lm[i].visibility<0.4))vis=false;}
  POSE.visible=vis;
  if(!vis){POSE.liveDepth*=0.9;POSE.liveRise*=0.9;return;}
  const a=0.45;
  for(const i of NEED){
    if(!POSE.sm[i])POSE.sm[i]={x:lm[i].x,y:lm[i].y};
    POSE.sm[i].x+=a*(lm[i].x-POSE.sm[i].x);
    POSE.sm[i].y+=a*(lm[i].y-POSE.sm[i].y);
  }
  const p=POSE.sm;
  const hipY=(p[LMK.LH].y+p[LMK.RH].y)/2;
  const shY=(p[LMK.LS].y+p[LMK.RS].y)/2;
  const ankY=(p[LMK.LA].y+p[LMK.RA].y)/2;
  if(POSE.calib.on){
    POSE.calib.frames.push({hipY,kneeL:p[LMK.LK].y,kneeR:p[LMK.RK].y,bodyH:ankY-shY});
    const pct=Math.min(100,Math.round(POSE.calib.frames.length/POSE.calib.need*100));
    updCalib(pct);
    if(POSE.calib.frames.length>=POSE.calib.need){
      const f=POSE.calib.frames,n=f.length,avg=k=>f.reduce((s,o)=>s+o[k],0)/n;
      POSE.base={hipY:avg('hipY'),kneeL:avg('kneeL'),kneeR:avg('kneeR'),bodyH:Math.max(.2,avg('bodyH'))};
      POSE.calib.on=false;calibDone();
    }
    return;
  }
  if(!POSE.base)return;
  const b=POSE.base,bh=b.bodyH,now=performance.now()/1000;
  const depth=(hipY-b.hipY)/bh;
  const rise=(b.hipY-hipY)/bh;
  POSE.liveDepth=Math.max(0,depth);
  POSE.liveRise=Math.max(0,rise);
  if(S.scene!=='play')return;
  const squatActive=S.enc&&(S.enc.kind==='rock'||S.enc.kind==='battle');
  $('#depthMeter').style.display=squatActive?'block':'none';
  if(squatActive)$('#depthFill').style.height=Math.min(100,Math.max(0,depth/0.22*100))+'%';
  if(!POSE.squatDown&&depth>0.18){POSE.squatDown=true;}
  if(POSE.squatDown&&depth<0.07){POSE.squatDown=false;onRep('squat');}
  if(!POSE.jumpUp&&rise>0.09&&now-POSE.lastJumpT>0.5){POSE.jumpUp=true;}
  if(POSE.jumpUp&&rise<0.03){POSE.jumpUp=false;POSE.lastJumpT=now;onRep('jump');}
  const liftL=(b.kneeL-p[LMK.LK].y)/bh,liftR=(b.kneeR-p[LMK.RK].y)/bh;
  stepKnee('L',liftL,now);stepKnee('R',liftR,now);
}
function stepKnee(side,lift,now){
  if(!POSE.kneeUp[side]&&lift>0.16&&now-POSE.lastStepT>0.16){
    POSE.kneeUp[side]=true;POSE.lastStepT=now;onRep('step');
  }
  if(POSE.kneeUp[side]&&lift<0.07)POSE.kneeUp[side]=false;
}
const BONES=[[11,12],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[11,13],[13,15],[12,14],[14,16]];
function drawCamSkeleton(lm){
  const r=$('#camPane').getBoundingClientRect();
  cg.clearRect(0,0,r.width,r.height);
  if(!lm)return;
  const v=POSE.video;
  const sc=Math.max(r.width/v.videoWidth,r.height/v.videoHeight);
  const dw=v.videoWidth*sc,dh=v.videoHeight*sc;
  const ox=(r.width-dw)/2,oy=(r.height-dh)/2;
  const X=p=>r.width-(ox+p.x*dw),Y=p=>oy+p.y*dh;
  cg.strokeStyle='rgba(90,211,138,.9)';cg.lineWidth=3;cg.lineCap='round';
  for(const[a2,b2]of BONES){
    if(!lm[a2]||!lm[b2])continue;
    cg.beginPath();cg.moveTo(X(lm[a2]),Y(lm[a2]));cg.lineTo(X(lm[b2]),Y(lm[b2]));cg.stroke();
  }
  cg.fillStyle='#FFC53D';
  for(const i of NEED){if(lm[i]){cg.beginPath();cg.arc(X(lm[i]),Y(lm[i]),4,0,7);cg.fill();}}
}

/* ---------------- レップ処理 ---------------- */
function onRep(mv){
  if(S.scene!=='play'||S.countdown>0)return;
  const now=S.t;
  if(mv==='jump'){lastJumpAny=now;S.char.hop=0.5;}
  const e=S.enc;
  if(!e){
    if(mv==='step'){
      S.reps.step++;SFX.step();
      S.char.walkPh+=Math.PI;
      if(now-S.lastStepT<0.9){S.streak++;}else{S.streak=1;}
      S.maxStreak=Math.max(S.maxStreak,S.streak);
      S.lastStepT=now;
      const boost=S.streak>=8?1.15:1.0;
      S.v=Math.min(3.4,S.v+0.85*boost);
      addScore(S.streak>=8?8:5,null);
    }
    if(mv==='jump'){S.reps.jump++;SFX.jump();}
    return;
  }
  if(e.kind==='rock'){
    if(e.hp<=0)return;
    if(mv==='squat'){
      S.reps.squat++;e.hp--;SFX.hit();
      S.char.attack=0.32;S.shake=0.25;addScore(30,'+30');
      G3.rockDamage(e);
      if(e.hp<=0)rockCleared(e,true);
    }
  }
  else if(e.kind==='battle'){
    if(e.state==='dead')return;
    if(mv==='squat'){
      S.reps.squat++;SFX.swing();
      S.char.attack=0.32;e.flinch=0.3;e.hp--;
      addScore(40,'+40');
      if(e.hp<=0){e.state='dead';e.deadT=0;SFX.kill();addScore(e.boss?250:150,e.boss?'+250':'+150');}
    }
    if(mv==='jump'){S.reps.jump++;}
  }
  else if(e.kind==='gap'){
    if(mv==='jump'&&e.armed&&!e.done){
      S.reps.jump++;e.done=true;
      S.char.vault=1.0;SFX.dodge();addScore(100,'+100');
      setTimeout(()=>{endEncounter(e,e.pos+e.width+0.3);},550);
    }
  }
  flash(mv==='step'?'GO!':'OK!');
}
function addScore(n,popup){
  S.score+=n;
  if(popup)S.popups.push({txt:popup,rx:0.5,ry:0.42,life:0.9});
}
function loseHeart(reason){
  S.hearts--;S.redFlash=0.55;SFX.hurt();S.shake=0.5;
  S.popups.push({txt:reason,rx:0.5,ry:0.36,life:1.2,red:true});
  drawHearts();
  if(S.hearts<=0){gameOver();}
}

/* ---------------- エンカウント進行 ---------------- */
function enterEncounter(ev){
  S.enc=ev;S.v=0;
  if(ev.kind==='battle'){ev.state='idle';ev.st=1.6+Math.random();}
  if(ev.kind==='gap'){ev.armed=true;ev.timer=ev.window;SFX.warn();}
  if(ev.kind==='rock'){SFX.warn();}
  updTask();
}
function endEncounter(ev,newDist){
  ev.done=true;S.enc=null;
  if(newDist!=null)S.dist=newDist;
  updTask();
}
function rockCleared(e,byPlayer){
  SFX.smash();S.shake=0.6;G3.rockExplode(e);
  if(byPlayer)addScore(Math.round(e.timer*10),'タイムボーナス +'+Math.round(e.timer*10));
  setTimeout(()=>endEncounter(e,null),400);
}
function updateEncounter(dt){
  const e=S.enc;if(!e)return;
  if(e.kind==='rock'){
    e.timer-=dt;
    if(e.timer<=0&&!e.done&&e.hp>0){
      loseHeart('落石をくらった！');
      G3.rockFall(e);S.shake=0.6;SFX.smash();
      e.hp=0;setTimeout(()=>endEncounter(e,null),500);
    }
  }
  else if(e.kind==='battle'){
    if(e.flinch>0)e.flinch-=dt;
    if(e.state==='idle'){
      e.st-=dt;
      if(e.st<=0){e.state='tele';e.st=e.tele;SFX.warn();}
    }
    else if(e.state==='tele'){
      e.st-=dt;
      if(e.st<=0){
        e.state='strike';e.st=0.35;SFX.slash();
        const dodged=(S.t-lastJumpAny<1.4||POSE.jumpUp||S.char.hop>0.15);
        S.slash={t:0.35,dodged};
        if(dodged){S.dodges++;SFX.dodge();addScore(80,'回避！ +80');}
        else{loseHeart(e.name+'の攻撃！');}
      }
    }
    else if(e.state==='strike'){
      e.st-=dt;
      if(e.st<=0){e.state='idle';e.st=e.atkMin+Math.random()*(e.atkMax-e.atkMin);}
    }
    else if(e.state==='dead'){
      e.deadT+=dt;
      if(e.deadT>0.9){endEncounter(e,null);}
    }
  }
  else if(e.kind==='gap'){
    if(e.done){
      const target=e.pos+e.width+0.3;
      S.dist=Math.min(target,S.dist+(e.width+1.6)/0.5*dt);
    }
    if(!e.done){
      e.timer-=dt;
      if(e.timer<=0){
        loseHeart('谷に落ちかけた…！');
        e.done=true;
        setTimeout(()=>endEncounter(e,e.pos+e.width+0.3),400);
      }
    }
  }
  updTask();
}

/* ---------------- 更新 ---------------- */
function update(dt){
  if(S.scene!=='play')return;
  if(S.countdown>0){
    const before=Math.ceil(S.countdown);
    S.countdown-=dt;
    const after=Math.ceil(S.countdown);
    if(after<before&&after>0)SFX.count();
    if(S.countdown<=0){SFX.go();}
    return;
  }
  S.t+=dt;
  if(!S.enc){
    S.v-=S.v*1.5*dt;if(S.v<0.01)S.v=0;
    if(S.t-S.lastStepT>1.1)S.streak=0;
    S.dist+=S.v*dt;
    S.char.walkPh+=S.v*dt*3.2;
    const nx=S.course.find(c=>!c.done&&S.dist>=c.pos-1.5);
    if(nx){
      if(nx.kind==='goal'){nx.done=true;finishRun();}
      else{S.dist=nx.pos-1.5;enterEncounter(nx);}
    }
    updTask();
  } else {
    updateEncounter(dt);
  }
  for(const p of S.popups){p.life-=dt;p.ry-=0.07*dt;}
  S.popups=S.popups.filter(p=>p.life>0);
  if(S.redFlash>0)S.redFlash-=dt;
  if(S.slash){S.slash.t-=dt;if(S.slash.t<=0)S.slash=null;}
  const st=$('#streak');
  st.textContent=S.streak>=8?`テンポ×${S.streak}!`:'';
  $('#hScore').textContent=String(S.score);
  $('#hTime').textContent=S.t.toFixed(1);
}

/* =========================================================
   3D世界（Three.js）＋ ドット絵スプライト
   ========================================================= */
const G3=(()=>{
  const glv=$('#glv'),ov2=$('#ov2'),og=ov2.getContext('2d');
  let OW=800,OH=540;
  const renderer=new THREE.WebGLRenderer({canvas:glv,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
  const scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x030201,0.13);
  scene.background=new THREE.Color(0x030201);
  const camera=new THREE.PerspectiveCamera(68,1,0.05,60);
  function fit(){
    const r=$('#gamePane').getBoundingClientRect();
    OW=Math.round(r.width);OH=Math.round(r.height);
    renderer.setSize(OW,OH,false);
    camera.aspect=OW/OH;camera.updateProjectionMatrix();
    const d=Math.min(devicePixelRatio||1,2);
    ov2.width=OW*d;ov2.height=OH*d;og.setTransform(d,0,0,d,0,0);
    fitCam();
  }
  addEventListener('resize',fit);

  /* ---- ドット絵ユーティリティ ---- */
  function px(map,pal,scale=6){
    const h=map.length,w=map[0].length;
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const x=c.getContext('2d');
    for(let j=0;j<h;j++)for(let i=0;i<w;i++){
      const ch=map[j][i];if(ch==='.'||!pal[ch])continue;
      x.fillStyle=pal[ch];x.fillRect(i,j,1,1);
    }
    return c;
  }
  function mirror(half){ // 左半分→左右対称の全体
    return half.map(r=>r+[...r].reverse().join(''));
  }
  function texOf(canvas){
    const t=new THREE.CanvasTexture(canvas);
    t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;
    t.colorSpace=THREE.SRGBColorSpace;
    return t;
  }
  function spriteMat(canvas){
    return new THREE.MeshBasicMaterial({map:texOf(canvas),transparent:true,alphaTest:0.05,side:THREE.DoubleSide,fog:true});
  }

  /* ---- 岩肌テクスチャ（プロシージャル） ---- */
  function stoneTex(base,dark,mossy){
    const c=document.createElement('canvas');c.width=128;c.height=128;
    const x=c.getContext('2d');
    x.fillStyle=base;x.fillRect(0,0,128,128);
    // 石ブロック
    for(let row=0;row<4;row++){
      const off=(row%2)*32;
      for(let col=-1;col<5;col++){
        const bx=col*48+off,by=row*32;
        const shade=0.85+Math.random()*0.3;
        x.fillStyle=shadeCol(base,shade);
        x.fillRect(bx+2,by+2,44,28);
        // 粒ノイズ
        for(let n=0;n<26;n++){
          x.fillStyle=`rgba(0,0,0,${0.08+Math.random()*0.12})`;
          x.fillRect(bx+2+Math.random()*44|0,by+2+Math.random()*28|0,2,2);
        }
        if(mossy&&Math.random()<0.3){
          x.fillStyle='rgba(74,90,46,0.35)';
          x.fillRect(bx+4+Math.random()*30|0,by+20,8+Math.random()*10|0,6);
        }
      }
    }
    x.fillStyle=dark; // 目地
    for(let row=0;row<=4;row++)x.fillRect(0,row*32,128,2);
    for(let row=0;row<4;row++){
      const off=(row%2)*32;
      for(let col=-1;col<5;col++)x.fillRect(col*48+off,row*32,2,32);
    }
    const t=texOf(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;
    return t;
  }
  function shadeCol(hex,k){

    if(hangFall>=0){
      hangFall+=dt;
      stalPlane.position.y=CH-0.44-hangFall*hangFall*11;
      if(hangFall>0.75)stalPlane.visible=false;
    }
    // ---- コウモリ ----
    const bat=S.course[1];
    if(bat){
      if(bat.done&&bat.state!=='dead'){batGroup.visible=false;}
      else{
        const flapFast=bat.state==='tele'?14:9;
        const fr=Math.floor(t*flapFast)%2===0;
        batA.visible=fr;batB.visible=!fr;
        let by=1.85+Math.sin(t*3)*0.12;
        let bz=-25, bs=1;
        if(bat.state==='strike'){const k=1-bat.st/0.35;bz=-25+Math.sin(k*Math.PI)*1.1;bs=1+Math.sin(k*Math.PI)*0.15;}
        if(bat.flinch>0){batGroup.position.x=Math.sin(t*60)*0.06;}else batGroup.position.x=0;
        if(bat.state==='dead'){
          const k=bat.deadT;
          by=1.85-k*k*3.2;bs=1;
          batGroup.rotation.z=k*2.2;
          batA.material.opacity=batB.material.opacity=Math.max(0,1-k*1.1);
          batA.material.transparent=batB.material.transparent=true;
        } else batGroup.rotation.z=0;
        batGroup.position.y=by;batGroup.position.z=bz;
        batGroup.scale.set(bs,bs,1);
        batGlow.visible=bat.state==='tele';
        batGlow.position.set(0,0.12,0.06);
      }
    }
    // ---- ガイコツ ----
    const sk=S.course[3];
    if(sk){
      if(sk.done&&sk.state!=='dead'){skelGroup.visible=false;}
      else{
        let sz=-51, ss=1;
        skelGroup.position.y=1.2+Math.sin(t*1.6)*0.02;
        if(sk.flinch>0){skelGroup.position.x=Math.sin(t*60)*0.06;}else skelGroup.position.x=0;
        // 剣の構え
        const target=sk.state==='tele'?-2.1:sk.state==='strike'?1.0:0.5;
        sword.rotation.z+=(target-sword.rotation.z)*Math.min(1,dt*14);
        if(sk.state==='strike'){const k=1-sk.st/0.35;sz=-51+Math.sin(k*Math.PI)*1.0;ss=1+Math.sin(k*Math.PI)*0.12;}
        if(sk.state==='dead'){
          const k=sk.deadT;
          skelGroup.rotation.x=k*1.5;
          skelGroup.position.y=1.2-k*0.7;
          skelBody.material.opacity=sword.material.opacity=Math.max(0,1-k*1.0);
          skelBody.material.transparent=sword.material.transparent=true;
        } else skelGroup.rotation.x=0;
        skelGroup.position.z=sz;skelGroup.scale.set(ss,ss,1);
        skelGlow.visible=sk.state==='tele';
      }
    }
    // 宝箱の鼓動
    chestLight.intensity=1.6+Math.sin(t*3)*0.5;
    chestMesh.position.y=0.5+Math.sin(t*3)*0.03;
    // 破片
    for(const d of debris){
      if(!d.m.visible)continue;
      d.life-=dt;
      if(d.life<=0){d.m.visible=false;continue;}
      d.v.y-=9.8*dt;
      d.m.position.addScaledVector(d.v,dt);
      if(d.m.position.y<0.06){d.m.position.y=0.06;d.v.y*=-0.3;d.v.x*=0.7;d.v.z*=0.7;}
      d.m.rotation.x+=dt*4;d.m.rotation.y+=dt*3;
    }
    renderer.render(scene,camera);
    drawOverlay(t,dt);
  }

  /* ---- 2Dオーバーレイ（！マーク・斬撃・両手・演出） ---- */
  function drawOverlay(t,dt){
    og.clearRect(0,0,OW,OH);
    // 「！」テレグラフ（敵頭上に投影）
    const showTele=(grp,e,yOff)=>{
      if(!e||e.state!=='tele')return;
      const p=projectToScreen(grp,yOff);
      if(p.z>1)return;
      const kk=e.st/e.tele;
      og.strokeStyle='rgba(229,83,60,.95)';og.lineWidth=5;
      og.beginPath();og.arc(p.x,p.y,18+70*kk,0,7);og.stroke();
      og.fillStyle='#E5533C';og.font='700 44px DotGothic16';
      og.textAlign='center';og.fillText('！',p.x,p.y+16);og.textAlign='left';
    };
    showTele(batGroup,S.course[1],0.75);
    showTele(skelGroup,S.course[3],1.3);
    // 斬撃
    if(S.slash){
      const k=1-S.slash.t/0.35;
      const yBase=S.slash.dodged?OH*0.8:OH*0.45;
      og.strokeStyle=`rgba(245,241,232,${(1-k)*0.95})`;
      og.lineWidth=9*(1-k*0.5);og.lineCap='round';
      og.beginPath();og.moveTo(OW*0.12+k*40,yBase-OH*0.16);og.lineTo(OW*0.88-k*40,yBase+OH*0.13);og.stroke();
      og.lineWidth=4*(1-k*0.5);
      og.beginPath();og.moveTo(OW*0.22+k*40,yBase-OH*0.2);og.lineTo(OW*0.92-k*40,yBase+OH*0.06);og.stroke();
      if(S.slash.dodged&&k<0.5){
        og.fillStyle='rgba(90,211,138,.95)';og.font='700 30px DotGothic16';
        og.textAlign='center';og.fillText('スカした！',OW/2,OH*0.64);og.textAlign='left';
      }
    }
    drawHands(t);
    // ビネット
    const vig=og.createRadialGradient(OW/2,OH/2,OH*0.38,OW/2,OH/2,OH*0.85);
    vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,.5)');
    og.fillStyle=vig;og.fillRect(0,0,OW,OH);
    // ポップアップ
    og.textAlign='center';
    for(const p of S.popups){
      og.font='700 24px DotGothic16';
      og.fillStyle=p.red?`rgba(229,83,60,${Math.min(1,p.life)})`:`rgba(255,197,61,${Math.min(1,p.life)})`;
      og.fillText(p.txt,p.rx*OW,p.ry*OH);
    }
    og.textAlign='left';
    if(S.redFlash>0){
      const rg=og.createRadialGradient(OW/2,OH/2,OH*0.2,OW/2,OH/2,OH*0.8);
      rg.addColorStop(0,'rgba(229,83,60,0)');rg.addColorStop(1,`rgba(229,83,60,${S.redFlash*0.9})`);
      og.fillStyle=rg;og.fillRect(0,0,OW,OH);
    }
    if(S.scene==='play'&&S.countdown>0){
      og.fillStyle='rgba(3,2,1,.6)';og.fillRect(0,0,OW,OH);
      og.textAlign='center';
      og.font='700 110px DotGothic16';og.fillStyle='#FFC53D';
      const n=Math.ceil(S.countdown-0.6);
      og.fillText(n>0?String(n):'GO!',OW/2,OH/2+40);
      og.textAlign='left';
    }
  }
  /* ---- FPSの両手（ドット絵・チャンキー描画） ---- */
  const pickC=(()=>{  // ピッケル（両手持ち）48x44 → 拡大
    const c=document.createElement('canvas');c.width=52;c.height=46;
    const x=c.getContext('2d');
    const P=(col,...rects)=>{x.fillStyle=col;for(const[a,b,w,h]of rects)x.fillRect(a,b,w,h);};
    // 柄（斜め）
    for(let i=0;i<26;i++)P('#7a5a2e',[12+i,40-i,4,3]);
    for(let i=0;i<26;i++)P('#5c421e',[12+i,42-i,2,1]);
    // ヘッド
    P('#12100c',[28,6,20,4],[24,8,8,4],[44,8,6,4],[30,4,14,2]);
    P('#c8c2b4',[29,7,18,2],[25,9,6,2],[45,9,4,2],[31,5,12,1]);
    P('#8a8270',[29,9,18,1],[36,11,6,2]);
    // グローブの手
    P('#12100c',[16,30,12,10],[26,22,11,9]);
    P('#6b4a26',[17,31,10,8],[27,23,9,7]);
    P('#f0cda8',[19,33,6,4],[29,25,5,3]);
    return c;
  })();
  const lantC=(()=>{  // ランタンを持つ手 30x36
    const c=document.createElement('canvas');c.width=30;c.height=38;
    const x=c.getContext('2d');
    const P=(col,...rects)=>{x.fillStyle=col;for(const[a,b,w,h]of rects)x.fillRect(a,b,w,h);};
    P('#12100c',[8,0,14,2],[6,2,4,6],[20,2,4,6]);       // 吊り手
    P('#12100c',[6,8,18,3]);                            // 上蓋
    P('#4a351e',[7,9,16,1]);
    P('#12100c',[7,11,3,14],[20,11,3,14]);              // 枠
    P('#ffe9b0',[10,11,10,14]);                         // ガラス
    P('#ffc53d',[11,14,8,9]);
    P('#ff8a3d',[12,17,6,6]);
    P('#12100c',[6,25,18,3]);                           // 底
    P('#6b4a26',[10,28,12,8]);                          // 手首
    P('#f0cda8',[12,26,8,4]);
    return c;
  })();
  function drawHands(t){
    const bob=Math.sin(S.char.walkPh)*7*Math.min(1,S.v)+Math.sin(t*1.3)*2;
    const sc=Math.max(3.4,OH/150);
    // 左：ランタン
    og.save();
    og.translate(OW*0.09,OH-lantC.height*sc*0.72+bob);
    og.rotate(Math.sin(t*2+S.char.walkPh*0.5)*0.06);
    og.imageSmoothingEnabled=false;
    og.drawImage(lantC,0,0,lantC.width*sc*0.8,lantC.height*sc*0.8);
    og.restore();
    // ランタンの光だまり
    const lgx=OW*0.09+lantC.width*sc*0.4,lgy=OH-lantC.height*sc*0.4+bob;
    const lg=og.createRadialGradient(lgx,lgy,4,lgx,lgy,OH*0.22);
    lg.addColorStop(0,'rgba(255,220,140,.22)');lg.addColorStop(1,'rgba(255,220,140,0)');
    og.fillStyle=lg;og.beginPath();og.arc(lgx,lgy,OH*0.22,0,7);og.fill();
    // 右：ピッケル（スクワットでフルスイング）
    const k=S.char.attack>0?1-S.char.attack/0.32:0;
    og.save();
    const px0=OW*0.72,py0=OH+30;
    og.translate(px0,py0+bob*0.7);
    const swing=S.char.attack>0? (0.5-2.2*Math.sin(k*Math.PI)) : (0.28+Math.sin(t*1.6)*0.03);
    og.rotate(swing);
    og.imageSmoothingEnabled=false;
    og.drawImage(pickC,-pickC.width*sc*0.5,-pickC.height*sc,pickC.width*sc,pickC.height*sc);
    // スイング残像
    if(S.char.attack>0&&k>0.15&&k<0.85){
      og.strokeStyle=`rgba(245,241,232,${0.5*(1-Math.abs(k-0.5)*2)})`;
      og.lineWidth=8;og.lineCap='round';
      og.beginPath();og.arc(0,0,pickC.height*sc*0.9,-2.4,-1.1);og.stroke();
    }
    og.restore();
  }

  fit();
  return {render,resetWorld,rockDamage,rockExplode,rockFall,fit};
})();

/* ---------------- メインループ ---------------- */
function loop(now){
  const dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  const t=now/1000;
  update(dt);
  G3.render(t,dt);
  const st=$('#camStatus');
  if(S.mode==='camera'&&S.scene==='play'){
    if(!POSE.visible){st.textContent='全身が見えません — 頭から足首まで映る位置へ';st.classList.add('warn');}
    else{st.textContent='検出中：足踏み／スクワット／ジャンプ';st.classList.remove('warn');}
  }
  requestAnimationFrame(loop);
}
screenMenu();
requestAnimationFrame(loop);
</script>
