<style>
:root{
  --navy:#0B1120; --amber:#FFC53D; --amber-dim:#8A6A22;
  --board:#171008; --board-line:#3A2A12;
  --white:#F5F1E8; --red:#E5533C; --good:#5AD38A; --torch:#FF8A3D;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--navy);overflow:hidden;
  font-family:'Zen Kaku Gothic New',sans-serif;color:var(--white);
  touch-action:manipulation;user-select:none;-webkit-user-select:none}
#wrap{height:100%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 0%, #16213C 0%, var(--navy) 60%)}
#stage{position:relative;width:min(100vw,177.7vh);aspect-ratio:16/9;max-height:100vh;
  background:var(--navy);overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.6);display:flex}

#camPane{position:relative;width:30%;height:100%;background:#05070E;border-right:2px solid var(--board-line);overflow:hidden}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#camCv{position:absolute;inset:0;width:100%;height:100%}
#camStatus{position:absolute;left:0;right:0;bottom:0;padding:2% 4%;
  background:rgba(5,7,14,.75);font-weight:700;font-size:clamp(10px,1.7vmin,14px);line-height:1.5;text-align:center;z-index:3}
#camStatus.warn{color:var(--red)}
#repFlash{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);
  font-family:'Anton',sans-serif;font-size:clamp(28px,7vmin,64px);color:var(--good);
  text-shadow:0 0 18px rgba(90,211,138,.7);opacity:0;pointer-events:none;z-index:3}
#repFlash.show{animation:pop .5s}
@keyframes pop{0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}70%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.2)}}
#depthMeter{position:absolute;right:4%;top:12%;bottom:22%;width:5%;min-width:14px;
  background:rgba(0,0,0,.45);border:1px solid var(--board-line);border-radius:6px;overflow:hidden;display:none;z-index:3}
#depthFill{position:absolute;bottom:0;left:0;right:0;height:0%;background:var(--amber)}
#depthGoal{position:absolute;left:0;right:0;height:2px;background:var(--good);bottom:81%}

#gamePane{position:relative;flex:1;height:100%}
#gv{position:absolute;inset:0;width:100%;height:100%;display:block}

#task{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);
  background:rgba(23,16,8,.92);border:2px solid var(--board-line);border-radius:10px;
  padding:1% 2.6%;text-align:center;min-width:62%;z-index:5;display:none}
#taskLbl{font-weight:900;font-size:clamp(13px,2.6vmin,22px);color:var(--white)}
#taskLbl b{color:var(--amber)}
#taskLbl .dodge{color:var(--good)}
#taskCnt{font-family:'Anton',sans-serif;color:var(--amber);font-size:clamp(18px,4vmin,36px);
  letter-spacing:.08em;text-shadow:0 0 10px rgba(255,197,61,.45)}
#task.alert{border-color:var(--red);animation:alertPulse .5s infinite alternate}
@keyframes alertPulse{from{box-shadow:0 0 0 0 rgba(229,83,60,.6)}to{box-shadow:0 0 0 12px rgba(229,83,60,0)}}

#topHud{position:absolute;top:1.5%;right:1.5%;z-index:5;display:none;gap:8px;align-items:stretch}
.miniBoard{background:rgba(23,16,8,.92);border:2px solid var(--board-line);border-radius:6px;padding:.35em .9em;text-align:center}
.miniBoard .lbl{font-size:clamp(8px,1.3vmin,12px);font-weight:700;color:var(--amber-dim);letter-spacing:.15em}
.miniBoard .val{font-family:'Anton',sans-serif;color:var(--amber);font-size:clamp(14px,2.8vmin,26px);line-height:1.1}
#hearts{display:flex;align-items:center;gap:4px;padding:.35em .7em}
#hearts svg{width:clamp(16px,3.2vmin,28px);height:auto}
#hearts .lost path{fill:#3A2A2A}

#streak{position:absolute;top:1.5%;left:32%;z-index:5;display:none;
  font-family:'Anton',sans-serif;color:var(--torch);font-size:clamp(14px,3vmin,26px);
  text-shadow:0 0 12px rgba(255,138,61,.6)}

#practiceBar{position:absolute;left:50%;bottom:15%;transform:translateX(-50%);z-index:6;display:none;gap:10px}
.pBtn{border:2px solid rgba(242,233,220,.6);background:rgba(20,28,50,.7);color:var(--white);
  border-radius:10px;font-family:'Zen Kaku Gothic New';font-weight:900;
  font-size:clamp(13px,2.4vmin,18px);padding:.8em 1.4em;cursor:pointer}
.pBtn:active{background:rgba(255,197,61,.35);border-color:var(--amber)}

#ovl{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center}
.panel{background:linear-gradient(180deg,rgba(13,18,35,.97),rgba(9,13,26,.97));
  border:2px solid var(--board-line);border-radius:14px;padding:3% 4.5%;
  width:min(92%,780px);max-height:94%;overflow-y:auto;text-align:center;
  box-shadow:0 10px 50px rgba(0,0,0,.7)}
.eyebrow{font-family:'Anton',sans-serif;color:var(--amber);letter-spacing:.35em;
  font-size:clamp(11px,1.8vmin,15px);margin-bottom:.6em}
h1{font-weight:900;font-size:clamp(24px,5.8vmin,52px);line-height:1.2}
h1 .en{display:block;font-family:'Anton',sans-serif;font-weight:400;color:var(--amber);
  font-size:clamp(13px,2.6vmin,22px);letter-spacing:.28em;margin-top:.35em;text-shadow:0 0 12px rgba(255,197,61,.4)}
h2{font-weight:900;font-size:clamp(19px,4.4vmin,36px);margin-bottom:.4em}
p.sub{color:#B9C2D8;font-size:clamp(12px,2.2vmin,16px);line-height:1.9;margin:.9em 0}
.btn{display:inline-block;border:none;cursor:pointer;border-radius:10px;
  font-family:'Zen Kaku Gothic New';font-weight:900;letter-spacing:.08em;
  font-size:clamp(14px,2.8vmin,20px);padding:.7em 1.8em;margin:.35em;
  background:var(--amber);color:#211502;box-shadow:0 5px 0 #A67C1B}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #A67C1B}
.btn.ghost{background:transparent;color:var(--white);border:2px solid rgba(242,233,220,.5);box-shadow:none}
.btn.ghost:active{transform:translateY(2px)}
.safety{background:rgba(229,83,60,.1);border:1px solid rgba(229,83,60,.5);border-radius:10px;
  padding:2.5% 4%;margin:1em 0;text-align:left;font-size:clamp(11px,2.1vmin,15px);line-height:2}
.safety b{color:var(--red)}
.moveList{display:grid;grid-template-columns:repeat(3,1fr);gap:2%;margin:1.2em 0}
.moveCard{background:rgba(255,197,61,.07);border:1px solid var(--amber-dim);border-radius:10px;padding:4% 3%}
.moveCard .mv{font-weight:900;color:var(--amber);font-size:clamp(12px,2.3vmin,18px)}
.moveCard .fx{font-size:clamp(10px,1.9vmin,14px);color:#B9C2D8;margin-top:.4em;line-height:1.6}
.trivia{font-size:clamp(11px,2vmin,14px);color:#8FB79E;border-top:1px solid #22304F;
  margin-top:1.2em;padding-top:1em;line-height:1.8;text-align:left}
.trivia b{color:var(--good)}
table.res{width:100%;border-collapse:collapse;margin:1em 0;font-size:clamp(12px,2.4vmin,18px)}
table.res td{padding:.5em .4em;border-bottom:1px solid #22304F;text-align:left;font-weight:700}
table.res td:last-child{text-align:right;font-family:'Anton',sans-serif;color:var(--amber)}
.rank{font-family:'Anton',sans-serif;font-size:clamp(56px,15vmin,140px);line-height:1;
  color:var(--amber);text-shadow:0 0 30px rgba(255,197,61,.6)}
.rankMsg{font-weight:900;font-size:clamp(13px,2.8vmin,20px);margin-top:.3em}
#calibRing{width:clamp(90px,20vmin,150px);height:clamp(90px,20vmin,150px);margin:1em auto;position:relative}
#calibRing svg{width:100%;height:100%;transform:rotate(-90deg)}
#calibPct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Anton',sans-serif;font-size:clamp(22px,5vmin,40px);color:var(--amber)}
#err{color:var(--red);font-weight:700;font-size:clamp(11px,2.1vmin,15px);line-height:1.8;margin-top:.6em}

#rotateHint{position:fixed;inset:0;background:var(--navy);z-index:99;display:none;
  align-items:center;justify-content:center;text-align:center;font-weight:900;
  font-size:clamp(16px,4.5vw,24px);line-height:2;padding:8%}
@media (orientation:portrait) and (max-width:600px){ #rotateHint{display:flex} }
@media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} }

<body>
<div id="wrap">
 <div id="stage">
  <div id="camPane">
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="camCv"></canvas>

  </div>
  <div id="gamePane">

      <div class="miniBoard" id="hearts"></div>

 </div>
</div>
<div id="rotateHint">画面を横向きにしてください<br><span style="font-weight:700;font-size:.7em;color:#B9C2D8">カメラとダンジョンを並べて表示します</span></div>

<script type="module">
"use strict";
/* =========================================================
   リアル体つくりダンジョン v3 — FPS視点
   カメラに映る自分が主人公。画面は一人称の洞窟ビュー。
   実際にしゃがめば視点が下がり、跳べば視界が浮く。
   ========================================================= */
const $=s=>document.querySelector(s);
const gv=$('#gv'),g=gv.getContext('2d');
const camCv=$('#camCv'),cg=camCv.getContext('2d');
const W=960,H=540;
function fit(){
  const d=Math.min(devicePixelRatio||1,2);
  gv.width=W*d;gv.height=H*d;g.setTransform(d,0,0,d,0,0);
  const r=$('#camPane').getBoundingClientRect();
  camCv.width=r.width*d;camCv.height=r.height*d;cg.setTransform(d,0,0,d,0,0);
}
fit();addEventListener('resize',fit);

/* ---------------- Audio ---------------- */
let AC=null;
function ac(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();}if(AC.state==='suspended')AC.resume();return AC;}
function tone(f,dur,type='square',vol=.15,slide=0,when=0){
  const a=ac(),t=a.currentTime+when,o=a.createOscillator(),gn=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);
  gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(gn).connect(a.destination);o.start(t);o.stop(t+dur+.02);
}
function noise(dur,vol=.3,when=0){
  const a=ac(),t=a.currentTime+when,n=a.sampleRate*dur|0;
  const b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource();s.buffer=b;
  const gn=a.createGain();gn.gain.setValueAtTime(vol,t);
  s.connect(gn).connect(a.destination);s.start(t);
}
const SFX={
  step(){tone(440,.05,'square',.07)},
  hit(){noise(.12,.3);tone(200,.12,'sawtooth',.15,-80)},
  smash(){noise(.4,.5);tone(90,.4,'sawtooth',.2,-40)},
  jump(){tone(300,.16,'square',.1,260)},
  dodge(){tone(700,.1,'square',.12);tone(1050,.14,'square',.1,0,.08)},
  hurt(){tone(150,.35,'sawtooth',.2,-70);noise(.2,.25)},
  warn(){tone(980,.09,'square',.14);tone(980,.09,'square',.14,0,.14)},
  slash(){noise(.08,.25);tone(520,.1,'sawtooth',.12,300)},
  swing(){noise(.07,.15);tone(340,.1,'sine',.08,180)},
  down(){[392,330,262,196].forEach((f,i)=>tone(f,.25,'square',.13,0,i*.14))},
  chest(){[523,659,784,1046,1318].forEach((f,i)=>tone(f,.3,'square',.12,0,i*.12))},
  go(){tone(880,.2,'sine',.15)},
  count(){tone(440,.15,'sine',.14)},
  kill(){tone(260,.3,'square',.15,-160);noise(.25,.3)},
};

/* ---------------- コース定義 ---------------- */
const GOAL=58;
function makeCourse(){
  return [
    {pos:13, kind:'rock', hp:5, hpMax:5, limit:13, timer:13, done:false,
      label:'落石が来る前に<b>スクワット</b>で岩を砕け！'},
    {pos:25, kind:'battle', name:'ドクロコウモリ', hp:4, hpMax:4, done:false,
      atkMin:3.2, atkMax:4.6, tele:1.7, state:'idle', st:2.2, flinch:0, deadT:0},
    {pos:38, kind:'gap', width:1.7, window:3.0, timer:3.0, armed:false, done:false},
    {pos:51, kind:'battle', name:'ガイコツ番人', hp:7, hpMax:7, done:false, boss:true,
      atkMin:2.6, atkMax:3.9, tele:1.45, state:'idle', st:2.0, flinch:0, deadT:0},
    {pos:GOAL, kind:'goal', done:false},
  ];
}

/* ---------------- ゲーム状態 ---------------- */
const S={
  mode:null, scene:'menu',
  t:0, dist:0, v:0,
  hearts:3, score:0, streak:0, lastStepT:-9,
  reps:{step:0,squat:0,jump:0}, dodges:0, maxStreak:0,
  course:[], enc:null,
  char:{hop:0,attack:0,vault:0,walkPh:0},
  fx:[], shake:0, redFlash:0, popups:[], slash:null,
  countdown:0,
};
let lastT=performance.now();
let lastJumpAny=-9;

/* ---------------- 姿勢検出 ---------------- */
const POSE={
  landmarker:null, video:$('#cam'), running:false,
  sm:{}, base:null,
  calib:{on:false, frames:[], need:70},
  squatDown:false, jumpUp:false, lastJumpT:0,
  kneeUp:{L:false,R:false}, lastStepT:0,
  visible:false, liveDepth:0, liveRise:0,
};
const LM={LS:11,RS:12,LH:23,RH:24,LK:25,RK:26,LA:27,RA:28};
const NEED=[LM.LS,LM.RS,LM.LH,LM.RH,LM.LK,LM.RK,LM.LA,LM.RA];
async function initPose(){
  const stat=$('#camStatus');
  stat.textContent='AIモデルを読み込み中…（初回は少し時間がかかります）';
  const url='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const vision=await import(url);
  const files=await vision.FilesetResolver.forVisionTasks(url+'/wasm');
  const opts=d=>({baseOptions:{
      modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
      delegate:d},runningMode:'VIDEO',numPoses:1});
  try{POSE.landmarker=await vision.PoseLandmarker.createFromOptions(files,opts('GPU'));}
  catch(e){POSE.landmarker=await vision.PoseLandmarker.createFromOptions(files,opts('CPU'));}
  stat.textContent='カメラを起動中…';
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
  POSE.video.srcObject=stream;
  await new Promise(r=>POSE.video.onloadedmetadata=r);
  await POSE.video.play();
  POSE.running=true;
  stat.textContent='全身（頭〜足首）が映るように下がろう';
  poseLoop();
}
let lastVideoT=-1;
function poseLoop(){
  if(!POSE.running)return;
  requestAnimationFrame(poseLoop);
  const v=POSE.video;
  if(v.currentTime===lastVideoT)return;
  lastVideoT=v.currentTime;
  let res;
  try{res=POSE.landmarker.detectForVideo(v,performance.now());}catch(e){return;}
  const lm=res.landmarks&&res.landmarks[0];
  drawCam(lm);
  if(!lm){POSE.visible=false;POSE.liveDepth=0;POSE.liveRise=0;return;}
  let vis=true;
  for(const i of NEED){if(!lm[i]||(lm[i].visibility!=null&&lm[i].visibility<0.4))vis=false;}
  POSE.visible=vis;
  if(!vis){POSE.liveDepth*=0.9;POSE.liveRise*=0.9;return;}
  const a=0.45;
  for(const i of NEED){
    if(!POSE.sm[i])POSE.sm[i]={x:lm[i].x,y:lm[i].y};
    POSE.sm[i].x+=a*(lm[i].x-POSE.sm[i].x);
    POSE.sm[i].y+=a*(lm[i].y-POSE.sm[i].y);
  }
  const p=POSE.sm;
  const hipY=(p[LM.LH].y+p[LM.RH].y)/2;
  const shY=(p[LM.LS].y+p[LM.RS].y)/2;
  const ankY=(p[LM.LA].y+p[LM.RA].y)/2;
  if(POSE.calib.on){
    POSE.calib.frames.push({hipY,kneeL:p[LM.LK].y,kneeR:p[LM.RK].y,bodyH:ankY-shY});
    const pct=Math.min(100,Math.round(POSE.calib.frames.length/POSE.calib.need*100));
    updCalib(pct);
    if(POSE.calib.frames.length>=POSE.calib.need){
      const f=POSE.calib.frames,n=f.length,avg=k=>f.reduce((s,o)=>s+o[k],0)/n;
      POSE.base={hipY:avg('hipY'),kneeL:avg('kneeL'),kneeR:avg('kneeR'),bodyH:Math.max(.2,avg('bodyH'))};
      POSE.calib.on=false;calibDone();
    }
    return;
  }
  if(!POSE.base)return;
  const b=POSE.base,bh=b.bodyH,now=performance.now()/1000;
  const depth=(hipY-b.hipY)/bh;
  const rise=(b.hipY-hipY)/bh;
  // 視点連動用のライブ値（プレイ外でも保持）
  POSE.liveDepth=Math.max(0,depth);
  POSE.liveRise=Math.max(0,rise);
  if(S.scene!=='play')return;
  const squatActive=S.enc&&(S.enc.kind==='rock'||S.enc.kind==='battle');
  $('#depthMeter').style.display=squatActive?'block':'none';
  if(squatActive)$('#depthFill').style.height=Math.min(100,Math.max(0,depth/0.22*100))+'%';
  if(!POSE.squatDown&&depth>0.18){POSE.squatDown=true;}
  if(POSE.squatDown&&depth<0.07){POSE.squatDown=false;onRep('squat');}
  if(!POSE.jumpUp&&rise>0.09&&now-POSE.lastJumpT>0.5){POSE.jumpUp=true;}
  if(POSE.jumpUp&&rise<0.03){POSE.jumpUp=false;POSE.lastJumpT=now;onRep('jump');}
  const liftL=(b.kneeL-p[LM.LK].y)/bh,liftR=(b.kneeR-p[LM.RK].y)/bh;
  stepKnee('L',liftL,now);stepKnee('R',liftR,now);
}
function stepKnee(side,lift,now){
  if(!POSE.kneeUp[side]&&lift>0.16&&now-POSE.lastStepT>0.16){
    POSE.kneeUp[side]=true;POSE.lastStepT=now;onRep('step');
  }
  if(POSE.kneeUp[side]&&lift<0.07)POSE.kneeUp[side]=false;
}
const BONES=[[11,12],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[11,13],[13,15],[12,14],[14,16]];
function drawCam(lm){
  const r=$('#camPane').getBoundingClientRect();
  cg.clearRect(0,0,r.width,r.height);
  if(!lm)return;
  const v=POSE.video;
  const sc=Math.max(r.width/v.videoWidth,r.height/v.videoHeight);
  const dw=v.videoWidth*sc,dh=v.videoHeight*sc;
  const ox=(r.width-dw)/2,oy=(r.height-dh)/2;
  const X=p=>r.width-(ox+p.x*dw),Y=p=>oy+p.y*dh;
  cg.strokeStyle='rgba(90,211,138,.9)';cg.lineWidth=3;cg.lineCap='round';
  for(const[a2,b2]of BONES){
    if(!lm[a2]||!lm[b2])continue;
    cg.beginPath();cg.moveTo(X(lm[a2]),Y(lm[a2]));cg.lineTo(X(lm[b2]),Y(lm[b2]));cg.stroke();
  }
  cg.fillStyle='#FFC53D';
  for(const i of NEED){if(lm[i]){cg.beginPath();cg.arc(X(lm[i]),Y(lm[i]),4,0,7);cg.fill();}}
}

/* ---------------- レップ処理 ---------------- */
function onRep(mv){
  if(S.scene!=='play'||S.countdown>0)return;
  const now=S.t;
  if(mv==='jump'){lastJumpAny=now;S.char.hop=0.5;}
  const e=S.enc;
  if(!e){
    if(mv==='step'){
      S.reps.step++;SFX.step();
      S.char.walkPh+=Math.PI;
      if(now-S.lastStepT<0.9){S.streak++;}else{S.streak=1;}
      S.maxStreak=Math.max(S.maxStreak,S.streak);
      S.lastStepT=now;
      const boost=S.streak>=8?1.15:1.0;
      S.v=Math.min(3.4,S.v+0.85*boost);
      addScore(S.streak>=8?8:5,null);
    }
    if(mv==='jump'){S.reps.jump++;SFX.jump();}
    return;
  }
  if(e.kind==='rock'){
    if(e.hp<=0)return;
    if(mv==='squat'){
      S.reps.squat++;e.hp--;SFX.hit();
      S.char.attack=0.32;S.shake=0.25;addScore(30,'+30');
      if(e.hp<=0)rockCleared(e,true);
    }
  }
  else if(e.kind==='battle'){
    if(e.state==='dead')return;
    if(mv==='squat'){
      S.reps.squat++;SFX.swing();
      S.char.attack=0.32;e.flinch=0.3;e.hp--;
      addScore(40,'+40');
      if(e.hp<=0){e.state='dead';e.deadT=0;SFX.kill();addScore(e.boss?250:150,e.boss?'+250':'+150');}
    }
    if(mv==='jump'){S.reps.jump++;}
  }
  else if(e.kind==='gap'){
    if(mv==='jump'&&e.armed&&!e.done){
      S.reps.jump++;e.done=true;
      S.char.vault=1.0;SFX.dodge();addScore(100,'+100');
      setTimeout(()=>{endEncounter(e,e.pos+e.width+0.3);},550);
    }
  }
  flash(mv==='step'?'GO!':'OK!');
}
function addScore(n,popup){
  S.score+=n;
  if(popup)S.popups.push({txt:popup,x:W/2,y:230,life:0.9});
}
function loseHeart(reason){
  S.hearts--;S.redFlash=0.55;SFX.hurt();S.shake=0.5;
  S.popups.push({txt:reason,x:W/2,y:200,life:1.2,red:true});
  drawHearts();
  if(S.hearts<=0){gameOver();}
}

/* ---------------- エンカウント進行 ---------------- */
function enterEncounter(ev){
  S.enc=ev;S.v=0;
  if(ev.kind==='battle'){ev.state='idle';ev.st=1.6+Math.random();}
  if(ev.kind==='gap'){ev.armed=true;ev.timer=ev.window;SFX.warn();}
  if(ev.kind==='rock'){SFX.warn();}
  updTask();
}
function endEncounter(ev,newDist){
  ev.done=true;S.enc=null;
  if(newDist!=null)S.dist=newDist;
  updTask();
}
function rockCleared(e,byPlayer){
  SFX.smash();S.shake=0.6;burst();
  if(byPlayer)addScore(Math.round(e.timer*10),'タイムボーナス +'+Math.round(e.timer*10));
  setTimeout(()=>endEncounter(e,null),400);
}
function updateEncounter(dt){
  const e=S.enc;if(!e)return;
  if(e.kind==='rock'){
    e.timer-=dt;
    if(e.timer<=0&&!e.done&&e.hp>0){
      loseHeart('落石をくらった！');
      burst();S.shake=0.6;SFX.smash();
      e.hp=0;setTimeout(()=>endEncounter(e,null),400);
    }
  }
  else if(e.kind==='battle'){
    if(e.flinch>0)e.flinch-=dt;
    if(e.state==='idle'){
      e.st-=dt;
      if(e.st<=0){e.state='tele';e.st=e.tele;SFX.warn();}
    }
    else if(e.state==='tele'){
      e.st-=dt;
      if(e.st<=0){
        e.state='strike';e.st=0.35;SFX.slash();
        const dodged=(S.t-lastJumpAny<1.4||POSE.jumpUp||S.char.hop>0.15);
        S.slash={t:0.35,dodged};
        if(dodged){S.dodges++;SFX.dodge();addScore(80,'回避！ +80');}
        else{loseHeart(e.name+'の攻撃！');}
      }
    }
    else if(e.state==='strike'){
      e.st-=dt;
      if(e.st<=0){e.state='idle';e.st=e.atkMin+Math.random()*(e.atkMax-e.atkMin);}
    }
    else if(e.state==='dead'){
      e.deadT+=dt;
      if(e.deadT>0.8){endEncounter(e,null);}
    }
  }
  else if(e.kind==='gap'){
    if(e.done){
      const target=e.pos+e.width+0.3;
      S.dist=Math.min(target,S.dist+(e.width+1.6)/0.5*dt);
    }
    if(!e.done){
      e.timer-=dt;
      if(e.timer<=0){
        loseHeart('谷に落ちかけた…！');
        e.done=true;
        setTimeout(()=>endEncounter(e,e.pos+e.width+0.3),400);
      }
    }
  }
  updTask();
}

/* ---------------- 更新 ---------------- */
function update(dt){
  if(S.scene!=='play')return;
  if(S.countdown>0){
    const before=Math.ceil(S.countdown);
    S.countdown-=dt;
    const after=Math.ceil(S.countdown);
    if(after<before&&after>0)SFX.count();
    if(S.countdown<=0){SFX.go();}
    return;
  }
  S.t+=dt;
  if(!S.enc){
    S.v-=S.v*1.5*dt;if(S.v<0.01)S.v=0;
    if(S.t-S.lastStepT>1.1)S.streak=0;
    S.dist+=S.v*dt;
    S.char.walkPh+=S.v*dt*3.2;
    const nx=S.course.find(c=>!c.done&&S.dist>=c.pos-1.35);
    if(nx){
      if(nx.kind==='goal'){nx.done=true;finishRun();}
      else{S.dist=nx.pos-1.35;enterEncounter(nx);}
    }
    updTask();
  } else {
    updateEncounter(dt);
  }
  for(const p of S.popups){p.life-=dt;p.y-=40*dt;}
  S.popups=S.popups.filter(p=>p.life>0);
  if(S.redFlash>0)S.redFlash-=dt;
  if(S.slash){S.slash.t-=dt;if(S.slash.t<=0)S.slash=null;}
  const st=$('#streak');
  st.textContent=S.streak>=8?`テンポ×${S.streak}!`:'';
  $('#hScore').textContent=String(S.score);
  $('#hTime').textContent=S.t.toFixed(1);
}

/* ---------------- FPS描画 ---------------- */
const VPX=W/2, VPY=245, FLOORY=505, CEILY=30, HALFW=560;
const FOG=0.10;
function proj(rel){return 1/(1+Math.max(-0.6,rel)*0.5);}
function fy(s){return VPY+(FLOORY-VPY)*s;}
function cy(s){return VPY-(VPY-CEILY)*s;}
function fogA(rel){return Math.max(0,Math.min(1,1.25-rel*FOG*1.6));}
function burst(){
  for(let i=0;i<30;i++){
    S.fx.push({x:VPX+(Math.random()-0.5)*160,y:330+Math.random()*80,
      vx:(Math.random()-0.5)*700,vy:-Math.random()*500,life:0.7+Math.random()*0.5,r:5+Math.random()*14});
  }
}
const torchZ=[];for(let i=0;i<30;i++)torchZ.push(2.5+i*4.2);

function cameraOffsets(t){
  // 実プレイヤーの体と視点を連動させる
  let y=0;
  if(S.mode==='camera'&&POSE.base){
    y+=Math.min(0.28,POSE.liveRise)*620;    // ジャンプ：視界が浮き、世界は下へ
    y-=Math.min(0.32,POSE.liveDepth)*420;   // スクワット：視点が下がり、世界は上へ
  } else {
    if(S.char.hop>0)y+=Math.sin((0.5-S.char.hop)/0.5*Math.PI)*90;
    if(S.char.attack>0)y-=Math.sin(S.char.attack/0.32*Math.PI)*46;
  }
  if(S.char.vault>0)y+=Math.sin((1-S.char.vault)*Math.PI)*120;
  y+=Math.abs(Math.sin(S.char.walkPh))*7*Math.min(1,S.v);   // 歩行バウンド
  let x=0;
  if(S.shake>0)x=Math.sin(t*70)*7*S.shake;
  return{x,y:Math.max(-140,Math.min(150,y))};
}
function draw(t,dt){
  const cam=S.dist;
  const off=cameraOffsets(t);
  // ---- ベース（闇） ----
  g.fillStyle='#060402';g.fillRect(0,0,W,H);
  g.save();g.translate(off.x,off.y);
  // ---- ヘッドランプの光 ----
  const light=g.createRadialGradient(VPX,VPY+20,30,VPX,VPY+20,760);
  light.addColorStop(0,'#57422A');
  light.addColorStop(0.35,'#2E2315');light.addColorStop(1,'#050302');
  g.fillStyle=light;g.fillRect(-200,-200,W+400,H+400);
  // ---- 通路の面（床・天井・壁のトーン） ----
  g.fillStyle='rgba(58,44,26,.5)';   // 床
  g.beginPath();g.moveTo(VPX-HALFW,FLOORY);g.lineTo(VPX,VPY);g.lineTo(VPX+HALFW,FLOORY);
  g.lineTo(VPX+HALFW,H+200);g.lineTo(VPX-HALFW,H+200);g.closePath();g.fill();
  g.fillStyle='rgba(18,12,7,.75)';   // 天井
  g.beginPath();g.moveTo(VPX-HALFW,CEILY);g.lineTo(VPX,VPY);g.lineTo(VPX+HALFW,CEILY);
  g.lineTo(VPX+HALFW,-200);g.lineTo(VPX-HALFW,-200);g.closePath();g.fill();
  g.fillStyle='rgba(32,22,12,.55)';  // 左右の壁
  g.beginPath();g.moveTo(VPX-HALFW,CEILY);g.lineTo(VPX,VPY);g.lineTo(VPX-HALFW,FLOORY);g.closePath();g.fill();
  g.beginPath();g.moveTo(VPX+HALFW,CEILY);g.lineTo(VPX,VPY);g.lineTo(VPX+HALFW,FLOORY);g.closePath();g.fill();
  // ---- 奥行きリング（坑道の梁） ----
  for(let z=Math.floor(cam)+14;z>=Math.floor(cam)+1;z--){
    const rel=z-cam;if(rel<=0.05)continue;
    const s=proj(rel),a=fogA(rel);
    if(a<=0)continue;
    const x0=VPX-HALFW*s,x1=VPX+HALFW*s,y0=cy(s),y1=fy(s);
    const wood=(z%2===0);
    g.strokeStyle=`rgba(${wood?'86,62,34':'52,38,22'},${a*0.9})`;
    g.lineWidth=Math.max(1.5,12*s);
    g.beginPath();
    g.moveTo(x0,y1);g.lineTo(x0,y0);g.lineTo(x1,y0);g.lineTo(x1,y1);
    g.stroke();
    // 床の横線
    g.strokeStyle=`rgba(20,13,7,${a*0.5})`;g.lineWidth=Math.max(1,4*s);
    g.beginPath();g.moveTo(x0,y1);g.lineTo(x1,y1);g.stroke();
  }
  // ---- たいまつ ----
  for(let i=0;i<torchZ.length;i++){
    const rel=torchZ[i]-cam;
    if(rel<0.15||rel>13)continue;
    const s=proj(rel),a=fogA(rel);
    const side=i%2===0?-1:1;
    const tx=VPX+side*HALFW*0.88*s;
    const ty=VPY+(330-VPY)*s;
    const fl=(6+Math.sin(t*9+i*2)*2.5)*s*3;
    const gr=g.createRadialGradient(tx,ty,2,tx,ty,150*s);
    gr.addColorStop(0,`rgba(255,138,61,${0.4*a})`);gr.addColorStop(1,'rgba(255,138,61,0)');
    g.fillStyle=gr;g.beginPath();g.arc(tx,ty,150*s,0,7);g.fill();
    g.strokeStyle=`rgba(74,53,30,${a})`;g.lineWidth=6*s;
    g.beginPath();g.moveTo(tx,ty+8*s);g.lineTo(tx,ty+34*s);g.stroke();
    g.fillStyle=`rgba(255,138,61,${a})`;g.beginPath();g.ellipse(tx,ty,7*s*2,fl+8*s,0,0,7);g.fill();
    g.fillStyle=`rgba(255,197,61,${a})`;g.beginPath();g.ellipse(tx,ty+3*s,4*s*2,fl*0.7,0,0,7);g.fill();
  }
  // ---- 距離マーカー（床の白線） ----
  g.textAlign='left';
  for(let m=5;m<=GOAL;m+=5){
    const rel=m-cam;
    if(rel<0.2||rel>12)continue;
    const s=proj(rel),a=fogA(rel)*0.5;
    const y=fy(s);
    g.strokeStyle=`rgba(242,233,220,${a})`;g.lineWidth=Math.max(1,3*s);
    g.beginPath();g.moveTo(VPX-HALFW*0.7*s,y);g.lineTo(VPX+HALFW*0.7*s,y);g.stroke();
    g.fillStyle=`rgba(242,233,220,${a+0.15})`;
    g.font=`400 ${Math.max(9,26*s)}px Anton`;
    g.fillText(m+'m',VPX+HALFW*0.72*s,y-4);
  }
  // ---- コースオブジェクト（奥→手前） ----
  const objs=S.course.filter(c=>{
    const rel=c.pos-cam;return rel>-1&&rel<13&&(!c.done||(c.kind==='battle'&&c.state==='dead'));
  }).sort((a,b)=>(b.pos-cam)-(a.pos-cam));
  for(const c of objs){
    const rel=Math.max(0.9,c.pos-cam);
    const s=proj(rel),a=fogA(rel);
    if(c.kind==='gap')drawGapFPS(c,cam);
    if(c.kind==='rock')drawRockFPS(c,s,a,t);
    if(c.kind==='battle')drawEnemyFPS(c,s,a,t);
    if(c.kind==='goal')drawChestFPS(s,a,t);
  }
  // ---- パーティクル ----
  for(const p of S.fx){p.life-=dt;p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  S.fx=S.fx.filter(p=>p.life>0);
  for(const p of S.fx){
    g.fillStyle=`rgba(120,95,60,${Math.min(1,p.life)})`;
    g.fillRect(p.x,p.y,p.r,p.r);
  }
  g.restore(); // カメラオフセットここまで
  // ---- 斬撃エフェクト（敵の攻撃） ----
  if(S.slash){
    const k=1-S.slash.t/0.35;
    const yBase=S.slash.dodged? H*0.78 : H*0.45;  // 回避時は足元を通過
    g.strokeStyle=`rgba(245,241,232,${(1-k)*0.95})`;
    g.lineWidth=10*(1-k*0.5);g.lineCap='round';
    g.beginPath();g.moveTo(W*0.15+ k*40, yBase-90);g.lineTo(W*0.85-k*40, yBase+70);g.stroke();
    g.lineWidth=5*(1-k*0.5);
    g.beginPath();g.moveTo(W*0.25+k*40, yBase-110);g.lineTo(W*0.9-k*40, yBase+30);g.stroke();
    if(S.slash.dodged&&k<0.5){
      g.fillStyle='rgba(90,211,138,.95)';g.font='900 34px "Zen Kaku Gothic New"';
      g.textAlign='center';g.fillText('スカした！',W/2,H*0.62);g.textAlign='left';
    }
  }
  // ---- FPSの両手 ----
  drawHands(t);
  // ---- ビネット ----
  const vig=g.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.85);
  vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,.55)');
  g.fillStyle=vig;g.fillRect(0,0,W,H);
  // ---- ポップアップ／被弾／カウントダウン ----
  g.textAlign='center';
  for(const p of S.popups){
    g.font='900 26px "Zen Kaku Gothic New"';
    g.fillStyle=p.red?`rgba(229,83,60,${Math.min(1,p.life)})`:`rgba(255,197,61,${Math.min(1,p.life)})`;
    g.fillText(p.txt,p.x,p.y);
  }
  g.textAlign='left';
  if(S.redFlash>0){
    const rg=g.createRadialGradient(W/2,H/2,H*0.2,W/2,H/2,H*0.8);
    rg.addColorStop(0,'rgba(229,83,60,0)');rg.addColorStop(1,`rgba(229,83,60,${S.redFlash*0.9})`);
    g.fillStyle=rg;g.fillRect(0,0,W,H);
  }
  if(S.scene==='play'&&S.countdown>0){
    g.fillStyle='rgba(6,4,2,.55)';g.fillRect(0,0,W,H);
    g.textAlign='center';
    g.font='400 120px Anton';g.fillStyle='#FFC53D';
    const n=Math.ceil(S.countdown-0.6);
    g.fillText(n>0?String(n):'GO!',W/2,H/2+40);
    g.textAlign='left';
  }
}
function drawGapFPS(c,cam){
  const r1=c.pos-cam, r2=c.pos+c.width-cam;
  if(r2<=0.1)return;
  const s1=proj(Math.max(0.12,r1)), s2=proj(Math.max(0.12,r2));
  const y1=fy(s1),y2=fy(s2);
  const hw=HALFW*0.8;
  g.fillStyle='#030201';
  g.beginPath();
  g.moveTo(VPX-hw*s1,y1);g.lineTo(VPX+hw*s1,y1);
  g.lineTo(VPX+hw*s2,y2);g.lineTo(VPX-hw*s2,y2);
  g.closePath();g.fill();
  g.strokeStyle='rgba(255,197,61,.5)';g.lineWidth=Math.max(1.5,4*s1);
  g.beginPath();g.moveTo(VPX-hw*s1,y1);g.lineTo(VPX+hw*s1,y1);g.stroke();
}
function drawRockFPS(c,s,a,t){
  const y=fy(s);
  const w=440*s, h=340*s;
  const cx=VPX;
  g.save();g.globalAlpha=a;
  // 本体
  const gr=g.createLinearGradient(cx,y-h,cx,y);
  gr.addColorStop(0,'#6B563C');gr.addColorStop(1,'#3A2C1A');
  g.fillStyle=gr;
  g.beginPath();
  g.moveTo(cx-w/2,y);
  g.quadraticCurveTo(cx-w/2-30*s,y-h*0.55,cx-w*0.22,y-h*0.92);
  g.quadraticCurveTo(cx,y-h*1.05,cx+w*0.26,y-h*0.88);
  g.quadraticCurveTo(cx+w/2+26*s,y-h*0.5,cx+w/2,y);
  g.closePath();g.fill();
  // ハイライト（ランプの光）
  g.fillStyle='rgba(255,197,61,.14)';
  g.beginPath();g.arc(cx-w*0.12,y-h*0.62,w*0.2,0,7);g.fill();
  // ひび
  g.strokeStyle='rgba(12,7,3,.95)';g.lineWidth=Math.max(2,6*s);g.lineCap='round';
  const cracks=Math.floor((1-c.hp/c.hpMax)*c.hpMax);
  for(let k=0;k<cracks;k++){
    const bx=cx-w*0.3+k*w*0.15;
    g.beginPath();
    g.moveTo(bx,y-h*0.85);
    g.lineTo(bx+18*s,y-h*0.6);
    g.lineTo(bx-10*s,y-h*0.35);
    g.lineTo(bx+14*s,y-h*0.1);
    g.stroke();
  }
  // 落石の予兆（天井の震える岩＋カウント）
  if(S.enc===c){
    const ur=Math.min(1,1-c.timer/c.limit);
    const sh=Math.sin(t*40)*4*ur;
    g.fillStyle='#4A3A26';
    g.beginPath();g.arc(cx+sh,cy(s)-10,40*s+16*ur,0,7);g.fill();
    g.fillStyle='rgba(229,83,60,.95)';
    g.font=`900 ${34*s+10}px "Zen Kaku Gothic New"`;
    g.textAlign='center';
    g.fillText(Math.max(0,c.timer).toFixed(1),cx,cy(s)+50*s+30);
    g.textAlign='left';
  }
  g.restore();
}
function drawEnemyFPS(c,s,a,t){
  const dead=c.state==='dead';
  const k=dead?c.deadT:0;
  const al=(dead?Math.max(0,1-k*1.2):1)*a;
  const strike=c.state==='strike';
  const sc=(strike?1.28:1)*(1+(c.flinch>0?Math.sin(t*60)*0.03:0))*s;
  g.save();g.globalAlpha=al;
  if(c.boss){
    // ガイコツ番人（正面）
    const cx=VPX+(c.flinch>0?Math.sin(t*60)*8:0);
    const by=VPY+(340-VPY)*s + k*260;
    const u=170*sc; // 基本サイズ
    // マント風の影
    g.fillStyle='rgba(10,6,3,.7)';
    g.beginPath();g.ellipse(cx,by+u*0.55,u*0.85,u*0.75,0,0,7);g.fill();
    // 肋骨
    g.strokeStyle='#D9D2C2';g.lineWidth=Math.max(3,10*sc);g.lineCap='round';
    for(let r=0;r<3;r++){
      g.beginPath();g.arc(cx,by+u*0.30+r*u*0.16,u*(0.42-r*0.06),Math.PI*0.15,Math.PI*0.85);g.stroke();
    }
    g.beginPath();g.moveTo(cx,by+u*0.1);g.lineTo(cx,by+u*0.75);g.stroke();
    // 腕（左右へ）
    g.beginPath();g.moveTo(cx-u*0.4,by+u*0.28);g.lineTo(cx-u*0.75,by+u*0.05);g.stroke();
    g.beginPath();g.moveTo(cx+u*0.4,by+u*0.28);g.lineTo(cx+u*0.72,by+u*0.3);g.stroke();
    // 頭蓋骨
    g.fillStyle='#E8E1D2';
    g.beginPath();g.arc(cx,by-u*0.16,u*0.34,0,7);g.fill();
    g.fillRect(cx-u*0.2,by+u*0.05,u*0.4,u*0.16);
    // 目（テレグラフで赤く発光）
    const eye=c.state==='tele'?'#E5533C':'#1A1008';
    if(c.state==='tele'){
      const gr=g.createRadialGradient(cx,by-u*0.18,2,cx,by-u*0.18,u*0.5);
      gr.addColorStop(0,'rgba(229,83,60,.5)');gr.addColorStop(1,'rgba(229,83,60,0)');
      g.fillStyle=gr;g.beginPath();g.arc(cx,by-u*0.18,u*0.5,0,7);g.fill();
    }
    g.fillStyle=eye;
    g.beginPath();g.arc(cx-u*0.13,by-u*0.2,u*0.09,0,7);g.fill();
    g.beginPath();g.arc(cx+u*0.13,by-u*0.2,u*0.09,0,7);g.fill();
    g.fillRect(cx-u*0.03,by-u*0.06,u*0.06,u*0.08); // 鼻腔
    // 歯
    g.fillStyle='#1A1008';
    for(let i2=-2;i2<=2;i2++)g.fillRect(cx+i2*u*0.07-u*0.015,by+u*0.1,u*0.03,u*0.08);
    // 剣（テレグラフで頭上に）
    const raise=c.state==='tele'?-2.4+Math.sin(t*20)*0.06:strike?0.7:-0.6;
    g.save();g.translate(cx+u*0.74,by+u*0.3);g.rotate(raise);
    g.strokeStyle='#C9D2DE';g.lineWidth=Math.max(4,12*sc);
    g.beginPath();g.moveTo(0,0);g.lineTo(0,-u*0.95);g.stroke();
    g.strokeStyle='#7A5A2E';g.lineWidth=Math.max(3,9*sc);
    g.beginPath();g.moveTo(-u*0.14,-u*0.1);g.lineTo(u*0.14,-u*0.1);g.stroke();
    g.restore();
  } else {
    // ドクロコウモリ（正面）
    const cx=VPX+(c.flinch>0?Math.sin(t*60)*8:0);
    const by=VPY+(300-VPY)*s + Math.sin(t*4)*12*s + k*260;
    const u=150*sc;
    const flap=Math.sin(t*13)*(c.state==='tele'?0.55:0.32);
    // 翼（膜＋骨）
    for(const sd of[-1,1]){
      g.save();g.translate(cx+sd*u*0.16,by);g.rotate(sd*flap);
      g.fillStyle='#332440';
      g.beginPath();g.moveTo(0,0);
      g.quadraticCurveTo(sd*u*0.7,-u*0.72,sd*u*1.25,-u*0.2);
      g.quadraticCurveTo(sd*u*0.95,u*0.02,sd*u*0.62,-u*0.02);
      g.quadraticCurveTo(sd*u*0.5,u*0.16,sd*u*0.28,u*0.1);
      g.closePath();g.fill();
      g.strokeStyle='#4A3858';g.lineWidth=Math.max(2,6*sc);
      g.beginPath();g.moveTo(0,0);g.lineTo(sd*u*0.7,-u*0.5);g.stroke();
      g.beginPath();g.moveTo(0,0);g.lineTo(sd*u*0.95,-u*0.28);g.stroke();
      g.restore();
    }
    // 胴体・頭
    g.fillStyle='#4A3858';
    g.beginPath();g.ellipse(cx,by+u*0.1,u*0.3,u*0.4,0,0,7);g.fill();
    g.beginPath();g.arc(cx,by-u*0.24,u*0.3,0,7);g.fill();
    // 耳
    g.beginPath();g.moveTo(cx-u*0.25,by-u*0.4);g.lineTo(cx-u*0.34,by-u*0.72);g.lineTo(cx-u*0.1,by-u*0.5);g.closePath();g.fill();
    g.beginPath();g.moveTo(cx+u*0.25,by-u*0.4);g.lineTo(cx+u*0.34,by-u*0.72);g.lineTo(cx+u*0.1,by-u*0.5);g.closePath();g.fill();
    // 目（発光）
    if(c.state==='tele'){
      const gr=g.createRadialGradient(cx,by-u*0.26,2,cx,by-u*0.26,u*0.55);
      gr.addColorStop(0,'rgba(229,83,60,.5)');gr.addColorStop(1,'rgba(229,83,60,0)');
      g.fillStyle=gr;g.beginPath();g.arc(cx,by-u*0.26,u*0.55,0,7);g.fill();
    }
    g.fillStyle='#E5533C';
    g.beginPath();g.arc(cx-u*0.12,by-u*0.28,u*0.07,0,7);g.fill();
    g.beginPath();g.arc(cx+u*0.12,by-u*0.28,u*0.07,0,7);g.fill();
    // 牙
    g.fillStyle='#F5F1E8';
    g.beginPath();g.moveTo(cx-u*0.1,by-u*0.1);g.lineTo(cx-u*0.05,by+u*0.02);g.lineTo(cx,by-u*0.1);g.closePath();g.fill();
    g.beginPath();g.moveTo(cx+u*0.02,by-u*0.1);g.lineTo(cx+u*0.07,by+u*0.02);g.lineTo(cx+u*0.12,by-u*0.1);g.closePath();g.fill();
  }
  // テレグラフ「！」
  if(c.state==='tele'){
    const kk=c.st/c.tele;
    const y0=VPY-60;
    g.strokeStyle='rgba(229,83,60,.95)';g.lineWidth=6;
    g.beginPath();g.arc(VPX,y0,26+90*kk,0,7);g.stroke();
    g.fillStyle='#E5533C';g.font='900 52px "Zen Kaku Gothic New"';
    g.textAlign='center';g.fillText('！',VPX,y0+18);g.textAlign='left';
  }
  g.restore();
}
function drawChestFPS(s,a,t){
  const y=fy(s),cx=VPX;
  const u=200*s,bob=Math.sin(t*3)*4*s;
  g.save();g.globalAlpha=a;
  const gr=g.createRadialGradient(cx,y-u*0.3+bob,6,cx,y-u*0.3+bob,u);
  gr.addColorStop(0,'rgba(255,197,61,.4)');gr.addColorStop(1,'rgba(255,197,61,0)');
  g.fillStyle=gr;g.beginPath();g.arc(cx,y-u*0.3+bob,u,0,7);g.fill();
  g.fillStyle='#7A4E22';g.fillRect(cx-u*0.4,y-u*0.34+bob,u*0.8,u*0.34);
  g.fillStyle='#9A6B33';
  g.beginPath();g.moveTo(cx-u*0.4,y-u*0.34+bob);
  g.quadraticCurveTo(cx,y-u*0.62+bob,cx+u*0.4,y-u*0.34+bob);g.closePath();g.fill();
  g.strokeStyle='#5A3A18';g.lineWidth=Math.max(2,5*s);
  g.strokeRect(cx-u*0.4,y-u*0.34+bob,u*0.8,u*0.34);
  g.fillStyle='#FFC53D';g.fillRect(cx-u*0.05,y-u*0.36+bob,u*0.1,u*0.2);
  g.restore();
}
/* ---- FPSの両手 ---- */
function drawHands(t){
  const bob=Math.sin(S.char.walkPh)*6*Math.min(1,S.v)+Math.sin(t*1.4)*2;
  // 左手：ランタン
  {
    const hx=110,hy=H-40+bob;
    const sw=Math.sin(t*2+S.char.walkPh*0.5)*0.08;
    g.save();g.translate(hx,hy);g.rotate(sw);
    // 腕
    g.strokeStyle='#2B3F66';g.lineWidth=34;g.lineCap='round';
    g.beginPath();g.moveTo(-70,90);g.lineTo(-6,10);g.stroke();
    // 手
    g.fillStyle='#F0CDA8';g.beginPath();g.arc(0,0,17,0,7);g.fill();
    // 取っ手＋ランタン
    g.strokeStyle='#3A2A12';g.lineWidth=5;
    g.beginPath();g.arc(0,-26,16,Math.PI*0.1,Math.PI*0.9,true);g.stroke();
    g.fillStyle='#171008';g.fillRect(-16,-30,32,8);
    const lg=g.createRadialGradient(0,-52,3,0,-52,46);
    lg.addColorStop(0,'rgba(255,220,140,.95)');lg.addColorStop(0.5,'rgba(255,180,80,.5)');lg.addColorStop(1,'rgba(255,180,80,0)');
    g.fillStyle=lg;g.beginPath();g.arc(0,-52,46,0,7);g.fill();
    g.fillStyle='rgba(255,235,190,.95)';
    g.beginPath();g.ellipse(0,-52,10,14+Math.sin(t*10)*2,0,0,7);g.fill();
    g.fillStyle='#171008';g.fillRect(-13,-74,26,7);
    g.restore();
  }
  // 右手：ピッケル（スクワットで振る）
  {
    const k=S.char.attack>0?1-S.char.attack/0.32:0;   // 0→1
    const swing=S.char.attack>0? (-0.35-2.0*Math.sin(k*Math.PI)) : (-0.35+bob*0.008);
    g.save();g.translate(W-90,H+30);g.rotate(swing);
    // 腕
    g.strokeStyle='#2B3F66';g.lineWidth=36;g.lineCap='round';
    g.beginPath();g.moveTo(60,120);g.lineTo(0,-10);g.stroke();
    // 手
    g.fillStyle='#F0CDA8';g.beginPath();g.arc(0,-16,19,0,7);g.fill();
    // 柄
    g.strokeStyle='#7A5A2E';g.lineWidth=14;
    g.beginPath();g.moveTo(0,-6);g.lineTo(0,-190);g.stroke();
    // ピッケルヘッド
    g.fillStyle='#B9C2D8';
    g.beginPath();
    g.moveTo(0,-190);
    g.quadraticCurveTo(-70,-214,-104,-176);
    g.quadraticCurveTo(-62,-186,-4,-172);g.closePath();g.fill();
    g.beginPath();
    g.moveTo(0,-190);
    g.quadraticCurveTo(70,-214,104,-176);
    g.quadraticCurveTo(62,-186,4,-172);g.closePath();g.fill();
    g.fillStyle='#8A94A8';g.fillRect(-10,-196,20,16);
    g.restore();
  }
}
function flash(txt){
  const el=$('#repFlash');el.textContent=txt;
  el.classList.remove('show');void el.offsetWidth;el.classList.add('show');
}

/* ---------------- メインループ ---------------- */
function loop(now){
  const dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  const t=now/1000;
  update(dt);
  draw(t,dt);
  const st=$('#camStatus');
  if(S.mode==='camera'&&S.scene==='play'){
    if(!POSE.visible){st.textContent='全身が見えません — 頭から足首まで映る位置へ';st.classList.add('warn');}
    else{st.textContent='検出中：足踏み／スクワット／ジャンプ';st.classList.remove('warn');}
  }
  requestAnimationFrame(loop);
}
screenMenu();
requestAnimationFrame(loop);
</script>
